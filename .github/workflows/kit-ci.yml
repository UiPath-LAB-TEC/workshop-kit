# The kit's own CI. validate.yml checks content repos; this checks the kit itself,
# so a change that would break all three is caught before any of them see it.
name: Kit CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck the shared components
        run: npm run typecheck

      # Consumers must resolve compiled JS, never raw .tsx. Shipping source only
      # appeared to work because a `file:` dependency is a symlink whose real path
      # sits outside node_modules and therefore does get transpiled; a genuine
      # install is a real directory, which webpack excludes.
      - name: Components are compiled for consumers
        run: |
          set -e
          npm run build
          for f in dist/components/WorkshopEnv.js dist/components/WorkshopHome.js \
                   dist/components/WorkshopEnv.d.ts dist/components/WorkshopHome.d.ts \
                   dist/components/WorkshopHome.module.css; do
            [ -f "$f" ] || { echo "FAIL: $f missing from the build"; exit 1; }
          done
          grep -q 'jsx-runtime' dist/components/WorkshopEnv.js \
            || { echo 'FAIL: JSX was not transformed'; exit 1; }
          grep -qE '^\s*(type|interface) ' dist/components/WorkshopEnv.js \
            && { echo 'FAIL: type syntax survived into the emitted JS'; exit 1; }
          node -e "
            const p = require('./package.json');
            for (const k of ['./components/WorkshopEnv', './components/WorkshopHome']) {
              const e = p.exports[k];
              if (!e || !String(e.default).startsWith('./dist/')) {
                throw new Error(k + ' must be exported from ./dist, got ' + JSON.stringify(e));
              }
            }
            console.log('exports point at dist');
          "

      - name: Every command module parses
        run: |
          for f in bin/workshop-kit.mjs src/index.mjs src/config/*.mjs src/commands/*.mjs tools/tenant-pulse-dashboard/server.mjs; do
            node --check "$f"
          done
          # Shared Python that no build step exercises, so nothing else would
          # catch a syntax error in it before an author ran it against a deck.
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])" tools/extract-pptx-assets.py

      - name: CLI responds
        run: |
          node bin/workshop-kit.mjs --version
          node bin/workshop-kit.mjs --help

      # The fence composer is the piece that silently corrupts a repo's AGENTS.md
      # if it regresses, so exercise it end to end on a scratch fixture.
      - name: AGENTS.md fence round-trip
        run: |
          set -e
          work="$(mktemp -d)"
          printf '# AGENTS.md instructions\n\n## General Workshop Instructions\n\nold forked copy\n\n## Project-Specific Instructions - Fixture\n\n- product content\n' > "$work/AGENTS.md"

          ( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" agents init )
          grep -q 'product content' "$work/AGENTS.md" || { echo 'FAIL: product content lost'; exit 1; }
          grep -q 'old forked copy' "$work/AGENTS.md" && { echo 'FAIL: stale General section kept'; exit 1; }

          ( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" agents check )

          # A change inside the fence must fail; a change below it must not.
          # perl -pi rather than sed -i: portable across GNU and BSD, so this whole
          # step can also be run locally before pushing.
          perl -pi -e 's/This section is shared workshop guidance\./tampered./' "$work/AGENTS.md"
          if ( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" agents check ); then
            echo 'FAIL: tampered fence passed the check'; exit 1
          fi
          ( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" agents build )
          ( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" agents check )

          printf '\n- an edit below the fence\n' >> "$work/AGENTS.md"
          ( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" agents check )
          echo 'fence round-trip OK'

      # zip-downloads is the highest blast radius component: a regression ships
      # broken files to workshop attendees.
      - name: ZIP pipeline renders tokens and warns on loose files
        run: |
          set -e
          work="$(mktemp -d)"
          mkdir -p "$work/config" "$work/downloads/project"
          cat > "$work/config/workshop-targets.json" <<'JSON'
          {
            "title": "Fixture", "tagline": "t", "repo": "org/repo",
            "defaultTarget": "local",
            "extraFields": {"codexModel": {"type": "string", "token": "WORKSHOP_CODEX_MODEL"}},
            "targets": {"local": {
              "siteUrl": "http://localhost:3000", "baseUrl": "/",
              "workshop": {"uipathOrgName": "org", "uipathTenantName": "tenant",
                "uipathTenantUrl": "https://example.invalid/org/tenant",
                "orchestratorParentFolder": "Shared", "codexModel": "m"},
              "codedApp": {"name": "fixture"}
            }}
          }
          JSON
          printf 'org={{WORKSHOP_UIPATH_ORG_NAME}} model={{WORKSHOP_CODEX_MODEL}} keep={{WORKSHOP_UNDECLARED}}\n' > "$work/downloads/project/AGENTS.md"
          printf 'loose\n' > "$work/downloads/stray.md"

          out="$( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" zip-downloads 2>&1 )"
          echo "$out"
          echo "$out" | grep -q 'stray.md is not inside a directory' || { echo 'FAIL: no loose-file warning'; exit 1; }

          unzip -p "$work/static/downloads/project.zip" AGENTS.md > "$work/got.txt"
          grep -q 'org=org' "$work/got.txt" || { echo 'FAIL: base token not rendered'; exit 1; }
          grep -q 'model=m' "$work/got.txt" || { echo 'FAIL: extraFields token not rendered'; exit 1; }
          grep -q 'keep={{WORKSHOP_UNDECLARED}}' "$work/got.txt" || { echo 'FAIL: undeclared token should stay literal'; exit 1; }
          grep -q '{{WORKSHOP_UIPATH_ORG_NAME}}' "$work/downloads/project/AGENTS.md" || { echo 'FAIL: source file was mutated'; exit 1; }
          echo 'zip pipeline OK'

      # Derivation is the only reason two targets can silently share an app name, so
      # the uniqueness guard is tested alongside it. `local` and a hosted target
      # normally point at the SAME tenant, which is exactly the colliding shape.
      - name: Coded App name derives from productSlug and tenant, uniquely
        run: |
          set -e
          work="$(mktemp -d)"; mkdir -p "$work/config"
          # $1 = extra top-level JSON, $2 = local's codedApp body, $3 = growth's
          write() {
            cat > "$work/config/workshop-targets.json" <<JSON
          {"title":"F","tagline":"t","repo":"o/r","docsLabel":"D","defaultTarget":"growth",$1
           "targets":{
            "local":{"siteUrl":"http://x","baseUrl":"/","workshop":{"uipathOrgName":"o","uipathTenantName":"Workshops","uipathTenantUrl":"u","orchestratorParentFolder":"Shared"},"codedApp":{$2"description":"d"}},
            "growth":{"siteUrl":"http://y","baseUrl":"/g/","workshop":{"uipathOrgName":"o","uipathTenantName":"Bellevue_July2026_20260727","uipathTenantUrl":"u","orchestratorParentFolder":"Shared"},"codedApp":{$3"description":"d"}}}}
          JSON
          }
          run() { ( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" codedapp check "$1" 2>&1 ); }

          # derives, and normalises underscores + case
          write '"productSlug":"ixp",' '"name":"ixp-local",' ''
          run growth | grep -q 'Coded App name: ixp-bellevue-july2026-20260727' \
            || { echo 'FAIL: did not derive/normalise'; exit 1; }

          # an explicit name always wins
          write '"productSlug":"ixp",' '"name":"ixp-local",' '"name":"hand-written",'
          run growth | grep -q 'Coded App name: hand-written' || { echo 'FAIL: explicit name ignored'; exit 1; }

          # no productSlug and no name is still a missing-field error
          write '' '"name":"ixp-local",' ''
          run growth 2>&1 | grep -q 'missing required fields: codedApp.name' \
            || { echo 'FAIL: absent name not reported'; exit 1; }

          # a derived name over 32 fails, and says it was derived
          write '"productSlug":"case-management",' '"name":"cm-local",' ''
          out="$(run growth)" && { echo 'FAIL: over-long derived name accepted'; exit 1; }
          echo "$out" | grep -q 'derived from productSlug' || { echo 'FAIL: error does not say it was derived'; exit 1; }

          # two targets resolving to one name is refused (same tenant, both derived)
          cat > "$work/config/workshop-targets.json" <<'JSON'
          {"title":"F","tagline":"t","repo":"o/r","docsLabel":"D","defaultTarget":"growth","productSlug":"ixp",
           "targets":{
            "local":{"siteUrl":"http://x","baseUrl":"/","workshop":{"uipathOrgName":"o","uipathTenantName":"Workshops","uipathTenantUrl":"u","orchestratorParentFolder":"Shared"},"codedApp":{"description":"d"}},
            "growth":{"siteUrl":"http://y","baseUrl":"/g/","workshop":{"uipathOrgName":"o","uipathTenantName":"Workshops","uipathTenantUrl":"u","orchestratorParentFolder":"Shared"},"codedApp":{"description":"d"}}}}
          JSON
          out="$(run growth)" && { echo 'FAIL: colliding app names accepted'; exit 1; }
          echo "$out" | grep -q 'both resolve to codedApp.name' || { echo 'FAIL: collision not reported'; exit 1; }
          echo 'name derivation OK'

      # The 32-char Coded App name limit is enforced in validateTarget, which every
      # command path reaches. It matters because `uip codedapp publish` ACCEPTS an
      # over-long name and only `deploy` refuses it, leaving an orphan package in
      # Orchestrator -- so the failure has to happen locally, before either runs.
      - name: Coded App name length is enforced at the 32-char boundary
        run: |
          set -e
          work="$(mktemp -d)"
          mkdir -p "$work/config"
          write_target() {
            cat > "$work/config/workshop-targets.json" <<JSON
          {"title":"F","tagline":"t","repo":"o/r","docsLabel":"D","defaultTarget":"local",
           "targets":{"local":{"siteUrl":"http://localhost:3000","baseUrl":"/",
           "workshop":{"uipathOrgName":"o","uipathTenantName":"t","uipathTenantUrl":"u","orchestratorParentFolder":"Shared"},
           "codedApp":{"name":"$1","description":"d"}}}}
          JSON
          }
          n32="$(printf 'a%.0s' $(seq 1 32))"
          n33="$(printf 'a%.0s' $(seq 1 33))"

          write_target "$n32"
          ( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" codedapp check >/dev/null 2>&1 ) \
            || { echo 'FAIL: a 32-character name was rejected'; exit 1; }

          write_target "$n33"
          out="$( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" codedapp check 2>&1 )" && {
            echo 'FAIL: a 33-character name was accepted'; exit 1; }
          echo "$out" | grep -q '33 characters' || { echo 'FAIL: error does not report the length'; exit 1; }

          # init must refuse a slug that would blow the budget in any standard pattern.
          slugdir="$(mktemp -d)"
          ( cd "$slugdir" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" init --product communications-mining >/dev/null 2>&1 ) && {
            echo 'FAIL: init accepted a 21-character slug'; exit 1; }
          [ -z "$(ls -A "$slugdir")" ] || { echo 'FAIL: init left files behind after rejecting'; exit 1; }
          ( cd "$slugdir" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" init --product comms-mining >/dev/null 2>&1 ) \
            || { echo 'FAIL: init rejected a 12-character slug'; exit 1; }
          echo 'name length rules OK'

      # This prune DELETES files from static/downloads/, so it is covered the same
      # way. The regression it guards: static/downloads/ is gitignored, so a stale
      # ZIP is invisible to CI and code review, yet `codedapp pack` packs the local
      # build/ dir that Docusaurus fills from static/ -- so it still reaches the
      # deployed site.
      - name: ZIP prune removes orphans, spares current zips and non-zips
        run: |
          set -e
          work="$(mktemp -d)"
          mkdir -p "$work/config" "$work/downloads/keep-me" "$work/static/downloads"
          cat > "$work/config/workshop-targets.json" <<'JSON'
          {
            "title": "Fixture", "tagline": "t", "repo": "org/repo",
            "defaultTarget": "local",
            "targets": {"local": {
              "siteUrl": "http://localhost:3000", "baseUrl": "/",
              "workshop": {"uipathOrgName": "org", "uipathTenantName": "tenant",
                "uipathTenantUrl": "https://example.invalid/org/tenant",
                "orchestratorParentFolder": "Shared"},
              "codedApp": {"name": "fixture"}
            }}
          }
          JSON
          printf 'content\n' > "$work/downloads/keep-me/file.txt"
          : > "$work/static/downloads/orphan.zip"
          : > "$work/static/downloads/notes.txt"
          # Seed the CURRENT zip too. This models a rebuild, which is the only
          # state in which a prune that ignores its keep-set is observable: on a
          # fresh tree there is no current zip present for it to wrongly delete.
          : > "$work/static/downloads/keep-me.zip"

          out="$( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" zip-downloads 2>&1 )"
          echo "$out"
          echo "$out" | grep -q 'Removed orphaned static/downloads/orphan.zip' || { echo 'FAIL: orphan not reported'; exit 1; }
          [ -e "$work/static/downloads/orphan.zip" ] && { echo 'FAIL: orphan zip survived'; exit 1; }
          [ -e "$work/static/downloads/keep-me.zip" ] || { echo 'FAIL: current zip missing'; exit 1; }
          [ -e "$work/static/downloads/notes.txt" ] || { echo 'FAIL: non-zip file was deleted'; exit 1; }
          # The prune runs BEFORE generation, so deleting a current zip is invisible
          # by file existence alone -- it is immediately recreated. Assert on the log
          # instead, or a prune that ignores its keep-set passes unnoticed.
          echo "$out" | grep -q 'Removed orphaned static/downloads/keep-me.zip' && { echo 'FAIL: current zip reported as orphaned'; exit 1; }

          # Emptying downloads/ makes every remaining zip an orphan. This is the
          # exact shape of the CA bug: the folder was deleted, the zip was not.
          rm -rf "$work/downloads/keep-me"
          out2="$( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" zip-downloads 2>&1 )"
          echo "$out2"
          [ -e "$work/static/downloads/keep-me.zip" ] && { echo 'FAIL: zip survived deletion of its source folder'; exit 1; }
          [ -e "$work/static/downloads/notes.txt" ] || { echo 'FAIL: non-zip file was deleted'; exit 1; }

          # No downloads/ at all means the kit is not managing that directory, so
          # it must not delete anything there.
          rm -rf "$work/downloads"
          : > "$work/static/downloads/untouched.zip"
          ( cd "$work" && node "$GITHUB_WORKSPACE/bin/workshop-kit.mjs" zip-downloads >/dev/null 2>&1 )
          [ -e "$work/static/downloads/untouched.zip" ] || { echo 'FAIL: pruned with no downloads/ dir'; exit 1; }
          echo 'zip prune OK'

      # The prune DELETES build artifacts, so it gets the same treatment as the
      # ZIP pipeline. The case that matters is the second one: one repo packs a
      # different app name per training target, and a global "keep the newest N"
      # would destroy an older target's only package.
      - name: Package prune keeps N per package name
        run: |
          set -e
          work="$(mktemp -d)"
          mkdir -p "$work/.uipath"
          cd "$work/.uipath"
          # older <- -> newer, within each name
          for f in only-once.0.1.0-20260101000000 \
                   many.0.1.0-20260101000000 many.0.1.0-20260102000000 \
                   many.0.1.0-20260103000000 many.0.1.0-20260104000000; do
            echo x > "$f.nupkg"
          done
          touch -t 202601010000 only-once.0.1.0-20260101000000.nupkg
          touch -t 202601010000 many.0.1.0-20260101000000.nupkg
          touch -t 202601020000 many.0.1.0-20260102000000.nupkg
          touch -t 202601030000 many.0.1.0-20260103000000.nupkg
          touch -t 202601040000 many.0.1.0-20260104000000.nupkg
          echo '{}' > app.config.json
          echo 'not-a-package' > loose.nupkg

          cd "$work"
          node --input-type=module -e "
            const {prunePackages} = await import('file://$GITHUB_WORKSPACE/src/commands/codedapp-deploy.mjs');
            prunePackages();
          "

          # The single old package of a name never packed again must survive,
          # even though four newer files exist under a different name.
          [ -f .uipath/only-once.0.1.0-20260101000000.nupkg ] \
            || { echo 'FAIL: pruned the only package of an untouched name'; exit 1; }
          [ "$(ls .uipath/many.*.nupkg | wc -l)" -eq 3 ] \
            || { echo 'FAIL: expected 3 survivors for "many"'; exit 1; }
          [ -f .uipath/many.0.1.0-20260101000000.nupkg ] \
            && { echo 'FAIL: oldest of the group survived'; exit 1; }
          [ -f .uipath/many.0.1.0-20260104000000.nupkg ] \
            || { echo 'FAIL: newest of the group was deleted'; exit 1; }
          [ -f .uipath/app.config.json ] || { echo 'FAIL: app.config.json removed'; exit 1; }
          [ -f .uipath/loose.nupkg ] || { echo 'FAIL: unparseable filename removed'; exit 1; }
          echo 'package prune OK'
